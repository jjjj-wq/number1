<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Data Collection Form</title>

<style>
body {
background-color: #1a1a1a;
display: flex;
min-height: 100vh;
width: 100%;
justify-content: center;
}

.container {
background-color: #dadada;
width: 400px;
height: fit-content;
margin-top: 40px;
padding: 30px;
display: flex;
align-items: center;
justify-content: center;
flex-direction: column;
border-radius: 10px;
border:none;
}

label {
font-weight: bold;
}

input {
padding: 6px;
margin-bottom: 4px;
border-radius: 10px;
border: .6 px solid #1a1a1a;
}

input[type='submit'] {
background-color: green;
color: white;
padding: 10px 45px;
margin-top: 40px;
border: none;
border-radius: 10px;
}

</style>
</head>

<body>

    <div class="container">

        <h2>Submit Your Information</h2>

        <form action="process_form.php" method="POST">

            <label for="name">Name:</label>

            <input type="text" id="name" name="user_name" required>

 

            <label for="email">Email:</label>

            <input type="email" id="email" name="user_email" required>

 

            <input type="submit" value="Submit">

        </form>

    </div>

</body>

</html>
